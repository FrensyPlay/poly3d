name: Build APK

on:
  push:
  workflow_dispatch:
    inputs:
      cloud:
        description: 'Настроить облако Supabase (хранилище, письма с кодом, вход VK, удаление аккаунта)'
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Распаковать проект
        run: unzip -o Poly3D-Android.zip

      - name: Подключить облако (секреты SUPABASE_URL и SUPABASE_ANON_KEY)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          VK_ON: ${{ secrets.VK_CLIENT_ID != '' && '1' || '0' }}
          GOOGLE_ON: ${{ secrets.GOOGLE_CLIENT_ID != '' && '1' || '0' }}
          PRIVACY_URL: ${{ vars.PRIVACY_URL }}
        run: |
          f=Poly3D-Android/app/src/main/assets/index.html
          if [ -n "$SUPABASE_URL" ]; then sed -i "s|__SUPABASE_URL__|${SUPABASE_URL%/}|" "$f"; fi
          if [ -n "$SUPABASE_ANON_KEY" ]; then sed -i "s|__SUPABASE_ANON_KEY__|$SUPABASE_ANON_KEY|" "$f"; fi
          sed -i "s|__VK_ENABLED__|$VK_ON|; s|__GOOGLE_ENABLED__|$GOOGLE_ON|" "$f"
          if [ -n "$PRIVACY_URL" ]; then sed -i "s|__PRIVACY_URL__|$PRIVACY_URL|" "$f"; fi
          if [ -n "$SUPABASE_URL" ]; then echo "Облако подключено"; else echo "Облако не подключено — вход в аккаунт будет недоступен"; fi

      - name: Ключ подписи для RuStore (секреты KEYSTORE_B64, KEY_PASSWORD, KEY_ALIAS)
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > Poly3D-Android/app/release.jks
            echo "P3D_KS=release.jks" >> "$GITHUB_ENV"
            echo "P3D_KS_PASS=$KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "P3D_KEY_PASS=$KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "P3D_KEY_ALIAS=${KEY_ALIAS:-poly3drelease}" >> "$GITHUB_ENV"
            echo "Подпись: ключ RuStore"
          else
            echo "Подпись: старый ключ poly3d.keystore"
          fi

      - name: Собрать APK
        working-directory: Poly3D-Android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          V=$(grep -oP "versionName '\K[^']+" app/build.gradle)
          mkdir -p ../out && cp app/build/outputs/apk/release/*.apk "../out/Poly3D-Studio-$V.apk"
          echo "APK_NAME=Poly3D-Studio-$V" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_NAME }}
          path: out/*.apk

  cloud:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.cloud }}
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      VK_CLIENT_ID: ${{ secrets.VK_CLIENT_ID }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_SECRET: ${{ secrets.GOOGLE_SECRET }}
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASS: ${{ secrets.SMTP_PASS }}
    steps:
      - uses: actions/checkout@v4
      - name: Распаковать проект
        run: unzip -o Poly3D-Android.zip
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Хранилище проектов (SQL)
        working-directory: Poly3D-Android
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "Нет секрета SUPABASE_ACCESS_TOKEN"; exit 1; }
          REF=$(echo "$SUPABASE_URL" | sed -E 's#https?://([^.]+)\..*#\1#'); echo "REF=$REF" >> "$GITHUB_ENV"
          jq -Rs '{query: .}' supabase/setup.sql > q.json
          curl -sS -f -X POST "https://api.supabase.com/v1/projects/$REF/database/query" -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" --data @q.json
          echo; echo "Хранилище готово"
      - name: Письма с кодом, адрес возврата, почта и Google
        working-directory: Poly3D-Android
        run: |
          T=$(cat supabase/email_code.html)
          jq -n --arg t "$T" '{uri_allow_list:"poly3d://auth,poly3d://**", mailer_otp_exp:3600,
            mailer_subjects_magic_link:"Код входа в Poly3D Studio", mailer_templates_magic_link_content:$t,
            mailer_subjects_confirmation:"Код входа в Poly3D Studio", mailer_templates_confirmation_content:$t}' > a.json
          if [ -n "$SMTP_HOST" ]; then
            jq --arg h "$SMTP_HOST" --arg p "${SMTP_PORT:-465}" --arg u "$SMTP_USER" --arg w "$SMTP_PASS" \
              '. + {smtp_host:$h, smtp_port:$p, smtp_user:$u, smtp_pass:$w, smtp_admin_email:$u, smtp_sender_name:"Poly3D Studio"}' a.json > b.json && mv b.json a.json
            echo "SMTP: $SMTP_HOST"
          else echo "ВНИМАНИЕ: SMTP не задан — без него коды приходят только участникам проекта Supabase"; fi
          if [ -n "$GOOGLE_CLIENT_ID" ]; then
            jq --arg i "$GOOGLE_CLIENT_ID" --arg s "$GOOGLE_SECRET" '. + {external_google_enabled:true, external_google_client_id:$i, external_google_secret:$s}' a.json > b.json && mv b.json a.json
            echo "Google включён"
          fi
          curl -sS -f -X PATCH "https://api.supabase.com/v1/projects/$REF/config/auth" -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" --data @a.json > /dev/null
          echo "Настройки входа сохранены"
      - name: Функции (вход VK и удаление аккаунта)
        working-directory: Poly3D-Android
        run: |
          supabase functions deploy delete-account --project-ref "$REF" --no-verify-jwt
          if [ -n "$VK_CLIENT_ID" ]; then
            supabase secrets set VK_CLIENT_ID="$VK_CLIENT_ID" --project-ref "$REF"
            supabase functions deploy vk-auth --project-ref "$REF" --no-verify-jwt
          fi
          echo "=============================================================="
          echo "Адрес возврата для VK ID:   https://$REF.supabase.co/functions/v1/vk-auth"
          echo "Адрес возврата для Google:  https://$REF.supabase.co/auth/v1/callback"
          echo "=============================================================="
