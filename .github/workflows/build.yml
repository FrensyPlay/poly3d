name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Распаковать проект
        run: unzip -o Poly3D-Android.zip

      - name: Подключить облако (секреты SUPABASE_URL и SUPABASE_ANON_KEY)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          VK_ON: ${{ secrets.VK_CLIENT_ID != '' && '1' || '0' }}
          GOOGLE_ON: ${{ secrets.GOOGLE_CLIENT_ID != '' && '1' || '0' }}
          PRIVACY_URL: ${{ vars.PRIVACY_URL }}
        run: |
          f=Poly3D-Android/app/src/main/assets/index.html
          if [ -n "$SUPABASE_URL" ]; then sed -i "s|__SUPABASE_URL__|${SUPABASE_URL%/}|" "$f"; fi
          if [ -n "$SUPABASE_ANON_KEY" ]; then sed -i "s|__SUPABASE_ANON_KEY__|$SUPABASE_ANON_KEY|" "$f"; fi
          sed -i "s|__VK_ENABLED__|$VK_ON|; s|__GOOGLE_ENABLED__|$GOOGLE_ON|" "$f"
          if [ -n "$PRIVACY_URL" ]; then sed -i "s|__PRIVACY_URL__|$PRIVACY_URL|" "$f"; fi

      - name: Ключ подписи для RuStore (секреты KEYSTORE_B64, KEY_PASSWORD, KEY_ALIAS)
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > Poly3D-Android/app/release.jks
            echo "P3D_KS=release.jks" >> "$GITHUB_ENV"
            echo "P3D_KS_PASS=$KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "P3D_KEY_PASS=$KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "P3D_KEY_ALIAS=${KEY_ALIAS:-poly3drelease}" >> "$GITHUB_ENV"
          fi

      - name: Собрать APK
        working-directory: Poly3D-Android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          V=$(grep -oP "versionName '\K[^']+" app/build.gradle)
          mkdir -p ../out && cp app/build/outputs/apk/release/*.apk "../out/Poly3D-Studio-$V.apk"
          echo "APK_NAME=Poly3D-Studio-$V" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_NAME }}
          path: out/*.apk
