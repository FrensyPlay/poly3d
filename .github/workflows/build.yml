name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Распаковать проект
        run: unzip -o Poly3D-Android.zip

      - name: Собрать APK
        working-directory: Poly3D-Android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: Poly3D-Studio-apk
          path: Poly3D-Android/app/build/outputs/apk/release/*.apk
